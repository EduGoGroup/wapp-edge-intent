name: CI

# CI de PR/push para wapp-edge-intent (módulo Go único, público).
# Calcado del patrón de wapp-cloudlink. La batería contra Ollama real se salta
# sola en CI (no hay modelo cargado), así que `go test` corre solo lo unitario.
# Módulos wApp públicos: sin GOPRIVATE ni token. El contrato de intents se
# consume por réplica local (replace en go.mod) hasta cortar intents/v0.1.0.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main] # red de seguridad

env:
  GO_VERSION: '1.26'

jobs:
  test:
    name: Tests + estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: gofmt (sin archivos sin formatear)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Archivos sin gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Descargar dependencias
        run: go mod download

      - name: go.mod / go.sum tidy (sin diff)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: Tests (race)
        run: go test -race ./...

      - name: Build
        run: go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # v2.4.0 no carga con Go 1.26; se fija v2.12.2 (probado local).
          version: v2.12.2
          args: --timeout=5m
